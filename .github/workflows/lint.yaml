name: CI

# What a reviewer would run by hand, run on every push: the contracts compile,
# the offline test suite passes, and the frontend lints, typechecks and builds.
#
# There is deliberately no deploy-to-local-node step. The contracts call the
# Hedera Schedule Service precompile at 0x16b, which a plain Hardhat node does
# not have — the test suite covers the whole loop against
# MockHederaScheduleService instead, which is the thing a local deploy would
# have been standing in for.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The floor the template declares, and the current LTS. Node 25's
        # stub localStorage is handled by packages/nextjs/node-compat.cjs.
        node: ["20.18.3", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile contracts
        run: npm run hardhat:compile

      - name: Test contracts (offline, against the mock scheduler)
        run: npm run hardhat:test

      - name: Lint contracts
        run: npm run hardhat:lint -- --max-warnings=0

      - name: Lint frontend
        run: npm run next:lint -- --max-warnings=0

      - name: Typecheck frontend
        run: npm run next:check-types

      - name: Build frontend
        run: npm run next:build
